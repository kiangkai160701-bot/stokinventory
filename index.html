<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบจัดการสต็อกสินค้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff0;--surf:#fff;--ink:#16221f;--mute:#62716d;--line:#dbe2e0;--acc:#0f6b62;--acc2:#e6f2f0;--warn:#b45309;--warn2:#fdf1e0;--bad:#b42318;--bad2:#fdeceb;--ok:#217a45;--ok2:#e5f4ea;--r:14px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Prompt',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #5bb5aa;outline-offset:2px}
.hide{display:none!important}
small{color:var(--mute);font-size:12px}
/* ---------- Login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding:20px}
.lg{width:100%;max-width:380px;background:var(--surf);border-radius:22px;padding:26px 22px;box-shadow:0 10px 40px rgba(22,34,31,.12)}
.lg h1{font-size:24px;font-weight:700;margin-bottom:2px}
.lg p{color:var(--mute);margin-bottom:18px}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
.in{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#f8faf9;min-height:48px}
.in:focus{border-color:var(--acc);background:#fff;outline:0;box-shadow:0 0 0 3px #cfe9e5}
.dots{display:flex;gap:10px;justify-content:center;margin:6px 0 14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc);transition:.12s}
.dots i.on{background:var(--acc)}
.dots.err i{border-color:var(--bad);background:var(--bad2)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:56px;border-radius:14px;background:#f1f4f3;font-size:22px;font-weight:500}
.pad button:active{background:var(--acc2)}
.msg{min-height:20px;text-align:center;font-size:13px;color:var(--bad);margin-bottom:6px}
.hint{margin-top:14px;font-size:12px;background:var(--warn2);color:var(--warn);padding:9px 12px;border-radius:10px}
/* ---------- App shell ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:14px}
.brand{font-weight:700;font-size:17px;flex:1;white-space:nowrap}
.brand small{display:block;color:#9fb3ae;font-weight:300;font-size:11px}
.dtabs{display:none;gap:4px}
.dtabs button,.nav button{color:#b8c9c5;padding:8px 14px;border-radius:10px;font-weight:500}
.dtabs button.on{background:#fff;color:var(--ink)}
.me{display:flex;align-items:center;gap:8px;background:#24342f;border-radius:999px;padding:5px 6px 5px 12px;font-size:13px}
.me b{font-weight:600}
.me button{background:#364a44;border-radius:999px;width:30px;height:30px;color:#fff;display:grid;place-items:center}
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;color:var(--mute);font-size:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.on{color:var(--acc);font-weight:600}
.nav svg{width:22px;height:22px}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.st{background:var(--surf);border-radius:var(--r);padding:13px 14px}
.st b{display:block;font-size:24px;font-weight:700;line-height:1.2}
.st.alert{background:var(--warn2)}.st.alert b{color:var(--warn)}
.st.bad{background:var(--bad2)}.st.bad b{color:var(--bad)}
/* ---------- Toolbar ---------- */
.tools{display:grid;gap:8px;margin-bottom:12px}
.srch{position:relative}
.srch svg{position:absolute;left:13px;top:15px;color:var(--mute)}
.srch .in{padding-left:40px}
.flt{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.flt select{flex:1;min-width:120px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:12px;font-weight:600;min-height:44px;background:var(--acc);color:#fff}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.bad{background:var(--bad)}
.btn.sm{min-height:36px;padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.5}
/* ---------- Product rows ---------- */
.list{display:grid;gap:10px}
.head{display:none}
.row{background:var(--surf);border-radius:var(--r);padding:13px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;border-left:5px solid var(--ok)}
.row.low{border-left-color:var(--warn)}.row.out{border-left-color:var(--bad)}
.c-name b{display:block;font-weight:600}
.c-qty{text-align:right}
.c-qty b{font-size:20px}
.c-loc,.c-price{font-size:13px;color:var(--mute)}
.c-price{text-align:right}
.meter{display:block;height:6px;background:#e5eae9;border-radius:9px;overflow:hidden;margin:4px 0 2px}
.meter u{display:block;height:100%;background:var(--ok);border-radius:9px}
.low .meter u{background:var(--warn)}.out .meter u{background:var(--bad)}
.c-act{grid-column:1/-1;display:flex;gap:8px;padding-top:6px;border-top:1px dashed var(--line);flex-wrap:wrap}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.p-ok{background:var(--ok2);color:var(--ok)}.p-low{background:var(--warn2);color:var(--warn)}.p-out{background:var(--bad2);color:var(--bad)}
.p-admin{background:#e7e9fb;color:#3b46a8}.p-staff{background:var(--acc2);color:var(--acc)}.p-viewer{background:#eee;color:#555}
.empty{background:var(--surf);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;border-radius:999px;padding:14px 20px;box-shadow:0 8px 24px rgba(15,107,98,.4)}
/* ---------- Logs / users ---------- */
.card{background:var(--surf);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.card .t{min-width:0}.card .t b{display:block;font-weight:600}
.amt{font-weight:700;white-space:nowrap}.amt.in{color:var(--ok)}.amt.out{color:var(--bad)}
.sect{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px;gap:10px}
.sect h2{font-size:18px}
/* ---------- Modal ---------- */
.ov{position:fixed;inset:0;z-index:40;background:rgba(10,20,17,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-size:18px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.seg label{text-align:center}
.seg input{position:absolute;opacity:0}
.seg span{display:block;padding:10px 4px;border:1.5px solid var(--line);border-radius:12px;font-weight:500}
.seg input:checked+span{background:var(--acc);color:#fff;border-color:var(--acc)}
.acts{display:flex;gap:10px;margin-top:6px}.acts .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:60;font-size:14px;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--bad)}
/* ---------- Desktop ---------- */
@media(min-width:860px){
 .nav,.fab-m{display:none}.dtabs{display:flex}
 main{padding:22px 24px 40px}
 .stats{grid-template-columns:repeat(4,1fr);gap:14px}
 .st b{font-size:28px}
 .tools{grid-template-columns:1fr auto auto;align-items:center}
 .flt{overflow:visible}.flt select{min-width:150px;flex:none}
 .head,.row{grid-template-columns:2.2fr 1fr 1.4fr 1fr auto;gap:16px;align-items:center}
 .head{display:grid;padding:0 16px;font-size:12px;color:var(--mute);font-weight:500}
 .row{padding:12px 16px}
 .c-act{grid-column:auto;border:0;padding:0;flex-wrap:nowrap}
 .c-qty{text-align:left}.c-price{text-align:left;font-size:14px;color:var(--ink)}
 .fab{position:static;box-shadow:none;border-radius:12px;padding:11px 18px}
 .ov{align-items:center}.sheet{border-radius:22px}
 .toast{bottom:28px}
 .ucard{max-width:760px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <form class="lg" id="lgForm" autocomplete="off">
    <h1>ระบบจัดการสต็อกสินค้า</h1>
    <p>เข้าสู่ระบบด้วยชื่อผู้ใช้และ PIN 6 หลัก</p>
    <label class="fld"><span>ชื่อผู้ใช้ (ภาษาอังกฤษ)</span>
      <input class="in" id="lgUser" maxlength="20" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="เช่น admin"></label>
    <div class="fld"><span>PIN 6 หลัก</span></div>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="msg" id="lgMsg"></div>
    <div class="pad" id="pad"></div>
    <div class="hint hide" id="lgHint">ครั้งแรกใช้งาน: ผู้ใช้ <b>admin</b> / PIN <b>123456</b> ระบบจะให้เปลี่ยน PIN ทันทีหลังเข้าสู่ระบบ</div>
  </form>
</section>

<!-- APP -->
<div id="app" class="hide">
  <header class="top">
    <div class="brand">สต็อกสินค้า<small id="clock"></small></div>
    <nav class="dtabs" id="dtabs"></nav>
    <div class="me"><span><b id="meName"></b> · <span id="meRole"></span></span>
      <button id="btnPin" title="เปลี่ยน PIN" aria-label="เปลี่ยน PIN"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
      <button id="btnOut" title="ออกจากระบบ" aria-label="ออกจากระบบ"><svg viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg></button>
    </div>
  </header>
  <main id="main"></main>
  <nav class="nav" id="nav"></nav>
</div>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const sess={get(){try{return sessionStorage.getItem('inv_u')}catch{return null}},set(v){try{v?sessionStorage.setItem('inv_u',v):sessionStorage.removeItem('inv_u')}catch{}}};
const baht=n=>'฿'+Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>Number(n).toLocaleString('th-TH');
const ROLE={admin:'ผู้ดูแล',staff:'พนักงานคลัง',viewer:'ดูอย่างเดียว'};
const CATS=['อิเล็กทรอนิกส์','เสื้อผ้า','อาหาร/เครื่องดื่ม','เครื่องเขียน','อื่นๆ'];
const UNITS=['ชิ้น','กล่อง','แพ็ค','ขวด','ชุด','กิโลกรัม'];
const I={
 plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 box:'<path d="M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>',log:'<path d="M12 8v5l3 2"/><circle cx="12" cy="12" r="9"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>',
 dl:'<path d="M12 4v11m-4-4 4 4 4-4M5 20h14"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;

/* ---------- Data ---------- */
let U=store.get('inv_users',null),P=store.get('inv_products',null),L=store.get('inv_log',[]);
let me=null,tab='stock',F={q:'',cat:'',st:'',sort:'name'};
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('inv:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{let h=5381;for(const c of 'inv:'+s)h=((h*33)^c.charCodeAt(0))>>>0;return'f'+h}}
const save=()=>{store.set('inv_users',U);store.set('inv_products',P);store.set('inv_log',L.slice(0,500))};
async function init(){
  if(!U){U=[{name:'admin',pin:await hash('123456'),role:'admin',active:true,must:true}]}
  if(!P){P=[
    {id:'P-1001',name:'เมาส์ไร้สาย Ergonomic',cat:'อิเล็กทรอนิกส์',unit:'ชิ้น',cost:380,price:590,qty:15,min:5,loc:'ชั้น A1'},
    {id:'P-1002',name:'สมุดโน้ตปกแข็ง A5',cat:'เครื่องเขียน',unit:'เล่ม',cost:70,price:120,qty:4,min:10,loc:'ชั้น B2'},
    {id:'P-1003',name:'เสื้อยืด Cotton 100%',cat:'เสื้อผ้า',unit:'ตัว',cost:150,price:290,qty:0,min:8,loc:'ชั้น C1'}]}
  save();
}

/* ---------- Login ---------- */
let pin='',lock=store.get('inv_lock',{n:0,until:0});
$('#pad').innerHTML=[1,2,3,4,5,6,7,8,9,'C',0,'⌫'].map(k=>`<button type="button" data-k="${k}" aria-label="${k==='⌫'?'ลบ':k==='C'?'ล้าง':k}">${k}</button>`).join('');
const drawDots=e=>{document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i<pin.length));$('#dots').classList.toggle('err',!!e)};
function press(k){
  if(k==='C')pin='';else if(k==='⌫')pin=pin.slice(0,-1);else if(pin.length<6)pin+=k;
  $('#lgMsg').textContent='';drawDots();
  if(pin.length===6)tryLogin();
}
$('#pad').addEventListener('click',e=>{const b=e.target.closest('button');if(b)press(b.dataset.k)});
$('#lgUser').addEventListener('input',e=>{e.target.value=e.target.value.replace(/[^A-Za-z0-9_]/g,'')});
document.addEventListener('keydown',e=>{
  if($('#login').classList.contains('hide')||document.activeElement===$('#lgUser'))return;
  if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('⌫')});
$('#lgForm').addEventListener('submit',e=>{e.preventDefault();if(pin.length===6)tryLogin()});
async function tryLogin(){
  const name=$('#lgUser').value.trim().toLowerCase(),msg=$('#lgMsg');
  const fail=t=>{msg.textContent=t;pin='';drawDots(true);setTimeout(()=>drawDots(),500)};
  if(Date.now()<lock.until)return fail(`ลองผิดหลายครั้ง รออีก ${Math.ceil((lock.until-Date.now())/1000)} วินาที`);
  if(!name)return fail('กรุณากรอกชื่อผู้ใช้ก่อน');
  const u=U.find(x=>x.name===name),h=await hash(pin);
  if(!u||u.pin!==h){
    lock.n++;if(lock.n>=5){lock={n:0,until:Date.now()+30000};store.set('inv_lock',lock);return fail('ลองผิด 5 ครั้ง ล็อกการเข้าสู่ระบบ 30 วินาที')}
    store.set('inv_lock',lock);return fail(`ชื่อผู้ใช้หรือ PIN ไม่ถูกต้อง (เหลือ ${5-lock.n} ครั้ง)`)}
  if(!u.active)return fail('บัญชีนี้ถูกปิดใช้งาน ติดต่อผู้ดูแลระบบ');
  lock={n:0,until:0};store.set('inv_lock',lock);sess.set(u.name);enter(u);
}
function enter(u){
  me=u;pin='';drawDots();$('#lgUser').value='';
  $('#login').classList.add('hide');$('#app').classList.remove('hide');
  $('#meName').textContent=u.name;$('#meRole').textContent=ROLE[u.role];
  tab='stock';build();
  if(u.must)pinModal(true);
}
function logout(){sess.set(null);me=null;closeModal();$('#app').classList.add('hide');$('#login').classList.remove('hide');showHint()}
function showHint(){$('#lgHint').classList.toggle('hide',!U.some(u=>u.name==='admin'&&u.must))}
$('#btnOut').onclick=logout;$('#btnPin').onclick=()=>pinModal(false);

/* ---------- Permissions ---------- */
const can={edit:()=>me.role!=='viewer',del:()=>me.role==='admin',users:()=>me.role==='admin'};

/* ---------- Shell ---------- */
function tabs(){return[['stock','สต็อก','box'],['log','ประวัติ','log'],...(can.users()?[['users','ผู้ใช้','users']]:[])]}
function build(){
  $('#nav').innerHTML=tabs().map(t=>`<button data-t="${t[0]}">${ic(t[2])}${t[1]}</button>`).join('');
  $('#dtabs').innerHTML=tabs().map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('');
  render();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b&&me){tab=b.dataset.t;render()}});
function render(){
  document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#main').innerHTML=tab==='stock'?stockView():tab==='log'?logView():usersView();
  if(tab==='stock')bindStock();window.scrollTo(0,0);
}
setInterval(()=>{$('#clock').textContent=new Date().toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})},1000);

/* ---------- Stock ---------- */
const status=p=>p.qty<=0?'out':p.qty<=p.min?'low':'ok';
const STX={ok:'ปกติ',low:'ใกล้หมด',out:'หมดสต็อก'};
function filtered(){
  const q=F.q.toLowerCase();
  let l=P.filter(p=>(!q||[p.name,p.id,p.cat,p.loc].some(x=>String(x||'').toLowerCase().includes(q)))&&(!F.cat||p.cat===F.cat)&&(!F.st||status(p)===F.st));
  const s={name:(a,b)=>a.name.localeCompare(b.name,'th'),qty:(a,b)=>a.qty-b.qty,value:(a,b)=>b.qty*b.price-a.qty*a.price};
  return l.sort(s[F.sort]);
}
function stockView(){
  const tq=P.reduce((s,p)=>s+p.qty,0),tv=P.reduce((s,p)=>s+p.qty*p.price,0),tc=P.reduce((s,p)=>s+p.qty*p.cost,0);
  const low=P.filter(p=>status(p)==='low').length,out=P.filter(p=>status(p)==='out').length;
  return`<div class="stats">
   <div class="st"><small>สินค้าทั้งหมด</small><b>${P.length}</b><small>${num(tq)} หน่วยในคลัง</small></div>
   <div class="st"><small>มูลค่าสต็อก (ราคาขาย)</small><b>${baht(tv)}</b><small>ต้นทุน ${baht(tc)}</small></div>
   <div class="st ${low?'alert':''}"><small>ใกล้หมด</small><b>${low}</b><small>ต่ำกว่าหรือเท่ากับขั้นต่ำ</small></div>
   <div class="st ${out?'bad':''}"><small>หมดสต็อก</small><b>${out}</b><small>ต้องสั่งเพิ่ม</small></div></div>
  <div class="tools">
   <div class="srch">${ic('search')}<input class="in" id="q" placeholder="ค้นหาชื่อ รหัส หมวดหมู่ หรือที่เก็บ" value="${esc(F.q)}"></div>
   <div class="flt">
    <select id="fc" aria-label="หมวดหมู่"><option value="">ทุกหมวดหมู่</option>${CATS.map(c=>`<option ${F.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    <select id="fs" aria-label="สถานะ"><option value="">ทุกสถานะ</option>${Object.entries(STX).map(([k,v])=>`<option value="${k}" ${F.st===k?'selected':''}>${v}</option>`).join('')}</select>
    <select id="fo" aria-label="เรียงลำดับ">${[['name','เรียงตามชื่อ'],['qty','จำนวนน้อยสุดก่อน'],['value','มูลค่าสูงสุดก่อน']].map(o=>`<option value="${o[0]}" ${F.sort===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
   </div>
   <div style="display:flex;gap:8px"><button class="btn sec" id="exp">${ic('dl')}CSV</button>${can.edit()?`<button class="btn fab" id="add">${ic('plus')}เพิ่มสินค้า</button>`:''}</div>
  </div>
  <div class="head"><span>สินค้า</span><span>ที่เก็บ</span><span>คงเหลือ</span><span>ราคาขาย / ทุน</span><span>จัดการ</span></div>
  <div class="list" id="list">${rows()}</div>`;
}
function rows(){
  const l=filtered();
  if(!l.length)return`<div class="empty"><b>ไม่พบสินค้า</b>${P.length?'ลองเปลี่ยนคำค้นหาหรือตัวกรอง':'กดปุ่ม "เพิ่มสินค้า" เพื่อเริ่มต้น'}</div>`;
  return l.map(p=>{const s=status(p),w=Math.min(100,Math.round(p.qty/Math.max(p.min*3,1)*100));
   return`<article class="row ${s}">
    <div class="c-name"><b>${esc(p.name)}</b><small>${esc(p.id)} · ${esc(p.cat)}</small></div>
    <div class="c-qty"><b>${num(p.qty)}</b> <small>${esc(p.unit)}</small><i class="meter"><u style="width:${w}%"></u></i><span class="pill p-${s}">${STX[s]}</span> <small>ขั้นต่ำ ${p.min}</small></div>
    <div class="c-loc">${esc(p.loc||'-')}</div>
    <div class="c-price">${baht(p.price)}<br><small>ทุน ${baht(p.cost)}</small></div>
    <div class="c-act">${can.edit()?`<button class="btn sm" data-mv="${p.id}">รับ/จ่าย</button><button class="btn sm sec" data-ed="${p.id}">แก้ไข</button>`:''}${can.del()?`<button class="btn sm sec" style="color:var(--bad)" data-dl="${p.id}">ลบ</button>`:''}</div>
   </article>`}).join('');
}
function bindStock(){
  const re=()=>{$('#list').innerHTML=rows()};
  $('#q').oninput=e=>{F.q=e.target.value;re()};
  $('#fc').onchange=e=>{F.cat=e.target.value;re()};$('#fs').onchange=e=>{F.st=e.target.value;re()};$('#fo').onchange=e=>{F.sort=e.target.value;re()};
  $('#exp').onclick=exportCSV;if($('#add'))$('#add').onclick=()=>prodModal();
  $('#list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
   if(d.mv)mvModal(d.mv);if(d.ed)prodModal(d.ed);if(d.dl)delProd(d.dl)};
}
function exportCSV(){
  const h=['รหัส','ชื่อสินค้า','หมวดหมู่','หน่วย','ต้นทุน','ราคาขาย','คงเหลือ','ขั้นต่ำ','ที่เก็บ','สถานะ'];
  const r=P.map(p=>[p.id,p.name,p.cat,p.unit,p.cost,p.price,p.qty,p.min,p.loc,STX[status(p)]].map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(','));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+[h.join(','),...r].join('\n')],{type:'text/csv'}));
  a.download='stock-'+new Date().toISOString().slice(0,10)+'.csv';a.click();toast('ส่งออกไฟล์ CSV แล้ว');
}

/* ---------- Modals ---------- */
function openModal(html){$('#modal').innerHTML=`<div class="ov" id="ov"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#ov').onmousedown=e=>{if(e.target.id==='ov'&&!$('#ov').dataset.lock)closeModal()};setTimeout(()=>{const f=$('#modal input:not([type=radio]),#modal select');f&&f.focus()},50)}
function closeModal(){$('#modal').innerHTML=''}
function toast(t,err){const e=$('#toast');e.textContent=t;e.className='toast show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='toast',2600)}
const fv=(f,n)=>f.elements[n].value.trim();
function addLog(type,p,amt,before,after,note){L.unshift({ts:Date.now(),user:me.name,type,pid:p.id,pname:p.name,amt,before,after,note:note||''})}

function prodModal(id){
  const p=id?P.find(x=>x.id===id):{name:'',cat:'',unit:'ชิ้น',cost:'',price:'',qty:0,min:5,loc:''};
  openModal(`<h3>${id?'แก้ไขสินค้า':'เพิ่มสินค้าใหม่'}</h3>
  <form id="pf">
   <label class="fld"><span>ชื่อสินค้า *</span><input class="in" name="name" required value="${esc(p.name)}"></label>
   <div class="g2"><label class="fld"><span>หมวดหมู่ *</span><select class="in" name="cat" required><option value="">เลือก</option>${CATS.map(c=>`<option ${p.cat===c?'selected':''}>${c}</option>`).join('')}</select></label>
   <label class="fld"><span>หน่วยนับ</span><input class="in" name="unit" list="ul" value="${esc(p.unit)}"><datalist id="ul">${UNITS.map(u=>`<option>${u}`).join('')}</datalist></label></div>
   <div class="g2"><label class="fld"><span>ต้นทุน/หน่วย (฿) *</span><input class="in" name="cost" type="number" min="0" step="0.01" inputmode="decimal" required value="${p.cost}"></label>
   <label class="fld"><span>ราคาขาย/หน่วย (฿) *</span><input class="in" name="price" type="number" min="0" step="0.01" inputmode="decimal" required value="${p.price}"></label></div>
   <div class="g2">${id?'':`<label class="fld"><span>จำนวนเริ่มต้น *</span><input class="in" name="qty" type="number" min="0" step="1" inputmode="numeric" required value="${p.qty}"></label>`}
   <label class="fld"><span>จำนวนขั้นต่ำ (แจ้งเตือน)</span><input class="in" name="min" type="number" min="0" step="1" inputmode="numeric" value="${p.min}"></label></div>
   <label class="fld"><span>ที่เก็บ</span><input class="in" name="loc" placeholder="เช่น ชั้น A1" value="${esc(p.loc||'')}"></label>
   ${id?'<small>การเพิ่มหรือลดจำนวน ให้ใช้ปุ่ม "รับ/จ่าย" เพื่อให้มีประวัติ</small>':''}
   <div class="acts"><button type="button" class="btn sec" onclick="closeModal()">ยกเลิก</button><button class="btn">${id?'บันทึกการแก้ไข':'เพิ่มสินค้า'}</button></div>
  </form>`);
  $('#pf').onsubmit=e=>{e.preventDefault();const f=e.target;
   const d={name:fv(f,'name'),cat:f.elements.cat.value,unit:fv(f,'unit')||'ชิ้น',cost:+f.elements.cost.value,price:+f.elements.price.value,min:Math.max(0,parseInt(f.elements.min.value)||0),loc:fv(f,'loc')};
   if(id){Object.assign(p,d);addLog('edit',p,0,p.qty,p.qty,'แก้ไขข้อมูลสินค้า');toast('บันทึกการแก้ไขแล้ว')}
   else{let n;do{n='P-'+(1000+Math.floor(Math.random()*9000))}while(P.some(x=>x.id===n));
    const np={id:n,qty:Math.max(0,parseInt(f.elements.qty.value)||0),...d};P.unshift(np);addLog('create',np,np.qty,0,np.qty,'เพิ่มสินค้าใหม่');toast('เพิ่มสินค้าแล้ว')}
   save();closeModal();render()};
}
function mvModal(id){
  const p=P.find(x=>x.id===id);
  openModal(`<h3>รับ/จ่ายสินค้า</h3><p style="margin-bottom:12px"><b>${esc(p.name)}</b><br><small>คงเหลือ ${num(p.qty)} ${esc(p.unit)}</small></p>
  <form id="mf"><div class="seg">
   <label><input type="radio" name="t" value="in" checked><span>รับเข้า</span></label>
   <label><input type="radio" name="t" value="out"><span>จ่ายออก</span></label>
   <label><input type="radio" name="t" value="adjust"><span>ปรับยอด</span></label></div>
   <label class="fld"><span id="ml">จำนวนที่รับเข้า</span><input class="in" name="n" type="number" min="0" step="1" inputmode="numeric" required></label>
   <label class="fld"><span>หมายเหตุ (เช่น เลขใบสั่งซื้อ, ขายหน้าร้าน)</span><input class="in" name="note" maxlength="80"></label>
   <div class="acts"><button type="button" class="btn sec" onclick="closeModal()">ยกเลิก</button><button class="btn">บันทึกรายการ</button></div></form>`);
  const lab={in:'จำนวนที่รับเข้า',out:'จำนวนที่จ่ายออก',adjust:'ยอดคงเหลือที่นับได้จริง'};
  $('#mf').onchange=e=>{if(e.target.name==='t')$('#ml').textContent=lab[e.target.value]};
  $('#mf').onsubmit=e=>{e.preventDefault();const f=e.target,t=f.elements.t.value,n=parseInt(f.elements.n.value);
   if(isNaN(n)||n<0)return toast('จำนวนไม่ถูกต้อง',1);
   if(t!=='adjust'&&n===0)return toast('จำนวนต้องมากกว่า 0',1);
   if(t==='out'&&n>p.qty)return toast(`จ่ายออกเกินคงเหลือ (มี ${p.qty})`,1);
   const b=p.qty;p.qty=t==='in'?b+n:t==='out'?b-n:n;
   addLog(t,p,t==='adjust'?p.qty-b:n,b,p.qty,fv(f,'note'));save();closeModal();render();
   toast(p.qty<=p.min?`บันทึกแล้ว — ${p.name} ${p.qty?'ใกล้หมด':'หมดสต็อก'}`:'บันทึกรายการแล้ว')};
}
function delProd(id){
  const p=P.find(x=>x.id===id);
  openModal(`<h3>ลบสินค้า?</h3><p style="margin-bottom:16px">ลบ <b>${esc(p.name)}</b> (คงเหลือ ${num(p.qty)} ${esc(p.unit)}) ออกจากระบบ การลบไม่สามารถย้อนกลับได้</p>
  <div class="acts"><button class="btn sec" onclick="closeModal()">ไม่ลบ</button><button class="btn bad" id="dy">ลบสินค้า</button></div>`);
  $('#dy').onclick=()=>{addLog('delete',p,0,p.qty,0,'ลบสินค้า');P=P.filter(x=>x.id!==id);save();closeModal();render();toast('ลบสินค้าแล้ว')};
}

/* ---------- Log ---------- */
const LT={in:['รับเข้า','in','+'],out:['จ่ายออก','out','-'],adjust:['ปรับยอด','','±'],create:['เพิ่มสินค้า','',''],edit:['แก้ไข','',''],delete:['ลบสินค้า','out','']};
function logView(){
  const l=L.slice(0,150);
  return`<div class="sect"><h2>ประวัติความเคลื่อนไหว</h2><small>ล่าสุด ${l.length} รายการ</small></div>`+
  (l.length?`<div class="list">${l.map(x=>{const t=LT[x.type];return`<div class="card"><div class="t"><b>${esc(x.pname)}</b>
   <small>${t[0]} · ${esc(x.user)} · ${new Date(x.ts).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})}${x.note?' · '+esc(x.note):''}</small></div>
   <div style="text-align:right"><span class="amt ${t[1]}">${t[2]}${x.amt?num(Math.abs(x.amt)):''}</span><br><small>${x.before} → ${x.after}</small></div></div>`}).join('')}</div>`
  :`<div class="empty"><b>ยังไม่มีประวัติ</b>เมื่อรับหรือจ่ายสินค้า รายการจะแสดงที่นี่</div>`);
}

/* ---------- Users ---------- */
function usersView(){
  return`<div class="sect"><h2>จัดการผู้ใช้</h2><button class="btn sm" id="nu">${ic('plus')}เพิ่มผู้ใช้</button></div>
  <div class="list ucard">${U.map(u=>`<div class="card"><div class="t"><b>${esc(u.name)}${u.name===me.name?' (คุณ)':''}</b>
   <span class="pill p-${u.role}">${ROLE[u.role]}</span> ${u.active?'':'<span class="pill p-out">ปิดใช้งาน</span>'}</div>
   <div style="display:flex;gap:6px"><button class="btn sm sec" data-ue="${u.name}">แก้ไข</button>${u.name!==me.name?`<button class="btn sm sec" style="color:var(--bad)" data-ud="${u.name}">ลบ</button>`:''}</div></div>`).join('')}</div>
  <p style="margin-top:14px;max-width:760px"><small>ผู้ดูแล: ทำได้ทุกอย่างรวมถึงลบสินค้าและจัดการผู้ใช้ · พนักงานคลัง: เพิ่ม/แก้ไขสินค้า รับ-จ่ายสต็อก · ดูอย่างเดียว: ดูข้อมูลและส่งออก CSV เท่านั้น</small></p>`;
}
document.addEventListener('click',e=>{
  if(!me||tab!=='users')return;const b=e.target.closest('button');if(!b)return;
  if(b.id==='nu')userModal();if(b.dataset.ue)userModal(b.dataset.ue);if(b.dataset.ud)delUser(b.dataset.ud)});
function userModal(name){
  const u=name?U.find(x=>x.name===name):{name:'',role:'staff',active:true};
  openModal(`<h3>${name?'แก้ไขผู้ใช้':'เพิ่มผู้ใช้ใหม่'}</h3><form id="uf">
   <label class="fld"><span>ชื่อผู้ใช้ (a-z, 0-9, _ ความยาว 3-20)</span><input class="in" name="name" required pattern="[A-Za-z0-9_]{3,20}" ${name?'readonly':''} autocapitalize="none" value="${esc(u.name)}"></label>
   <label class="fld"><span>${name?'PIN ใหม่ (เว้นว่างถ้าไม่เปลี่ยน)':'PIN 6 หลัก *'}</span><input class="in" name="pin" inputmode="numeric" pattern="\\d{6}" maxlength="6" ${name?'':'required'} placeholder="••••••"></label>
   <label class="fld"><span>ตำแหน่ง</span><select class="in" name="role">${Object.entries(ROLE).map(([k,v])=>`<option value="${k}" ${u.role===k?'selected':''}>${v}</option>`).join('')}</select></label>
   <label class="fld" style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="act" ${u.active?'checked':''}><span style="margin:0">เปิดใช้งานบัญชี</span></label>
   <div class="acts"><button type="button" class="btn sec" onclick="closeModal()">ยกเลิก</button><button class="btn">บันทึก</button></div></form>`);
  $('#uf').onsubmit=async e=>{e.preventDefault();const f=e.target,n=fv(f,'name').toLowerCase(),pn=f.elements.pin.value;
   if(!name&&U.some(x=>x.name===n))return toast('ชื่อผู้ใช้นี้มีอยู่แล้ว',1);
   if(pn&&!/^\d{6}$/.test(pn))return toast('PIN ต้องเป็นตัวเลข 6 หลัก',1);
   const role=f.elements.role.value,act=f.elements.act.checked;
   const admins=U.filter(x=>x.role==='admin'&&x.active&&x.name!==name).length+(role==='admin'&&act?1:0);
   if(admins<1)return toast('ต้องมีผู้ดูแลที่เปิดใช้งานอย่างน้อย 1 คน',1);
   if(name){Object.assign(u,{role,active:act});if(pn){u.pin=await hash(pn);u.must=false}if(u.name===me.name){me=u;$('#meRole').textContent=ROLE[role]}}
   else U.push({name:n,pin:await hash(pn),role,active:act,must:false});
   save();closeModal();render();toast('บันทึกผู้ใช้แล้ว');if(u.name===me.name&&role!=='admin')build()};
}
function delUser(name){
  if(U.filter(x=>x.role==='admin'&&x.name!==name).length<1)return toast('ลบไม่ได้ ต้องมีผู้ดูแลอย่างน้อย 1 คน',1);
  openModal(`<h3>ลบผู้ใช้ ${esc(name)}?</h3><p style="margin-bottom:16px">ผู้ใช้นี้จะเข้าสู่ระบบไม่ได้อีก</p><div class="acts"><button class="btn sec" onclick="closeModal()">ไม่ลบ</button><button class="btn bad" id="dy">ลบผู้ใช้</button></div>`);
  $('#dy').onclick=()=>{U=U.filter(x=>x.name!==name);save();closeModal();render();toast('ลบผู้ใช้แล้ว')};
}

/* ---------- Change own PIN ---------- */
function pinModal(force){
  openModal(`<h3>${force?'ตั้ง PIN ใหม่ก่อนใช้งาน':'เปลี่ยน PIN'}</h3>${force?'<p style="margin-bottom:12px"><small>บัญชีนี้ยังใช้ PIN เริ่มต้น กรุณาตั้ง PIN 6 หลักของคุณเอง</small></p>':''}
  <form id="pn">${force?'':'<label class="fld"><span>PIN ปัจจุบัน</span><input class="in" name="old" inputmode="numeric" pattern="\\d{6}" maxlength="6" required></label>'}
   <label class="fld"><span>PIN ใหม่ 6 หลัก</span><input class="in" name="n1" inputmode="numeric" pattern="\\d{6}" maxlength="6" required></label>
   <label class="fld"><span>ยืนยัน PIN ใหม่</span><input class="in" name="n2" inputmode="numeric" pattern="\\d{6}" maxlength="6" required></label>
   <div class="acts">${force?'':'<button type="button" class="btn sec" onclick="closeModal()">ยกเลิก</button>'}<button class="btn">บันทึก PIN</button></div></form>`);
  if(force)$('#ov').dataset.lock=1;
  $('#pn').onsubmit=async e=>{e.preventDefault();const f=e.target,n1=f.elements.n1.value;
   if(!force&&await hash(f.elements.old.value)!==me.pin)return toast('PIN ปัจจุบันไม่ถูกต้อง',1);
   if(n1!==f.elements.n2.value)return toast('PIN ใหม่ทั้งสองช่องไม่ตรงกัน',1);
   if(n1==='123456'||/^(\d)\1{5}$/.test(n1))return toast('PIN เดาง่ายเกินไป เลือกเลขอื่น',1);
   me.pin=await hash(n1);me.must=false;save();closeModal();toast('เปลี่ยน PIN เรียบร้อยแล้ว')};
}

/* ---------- Start ---------- */
(async()=>{
  await init();showHint();drawDots();
  const s=sess.get(),u=s&&U.find(x=>x.name===s&&x.active);
  if(u)enter(u);
})();
</script>
