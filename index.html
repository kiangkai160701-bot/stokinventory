<style>
:root {
  --bg: #0f172a;
  --bg-app: #fff7f8;
  --card-bg: #ffffff;
  --card-border: #e2e8f0;
  --ink: #0f172a;
  --mute: #64748b;
  --line: #e2e8f0;
  --acc: #0d9488;
  --acc-hover: #0f766e;
  --acc-light: #f0fdfa;
  --acc-glow: rgba(13, 148, 136, 0.15);
  --warn: #d97706;
  --warn-bg: #fffbeb;
  --bad: #e11d48;
  --bad-bg: #fff1f2;
  --ok: #10b981;
  --ok-bg: #ecfdf5;
  --r: 16px;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.02);
  --shadow-md: 0 8px 20px -4px rgba(0, 0, 0, 0.04);
  --font: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
}

/* Theme Variations */
body[data-theme="indigo"] { --acc: #4f46e5; --acc-hover: #4338ca; --acc-light: #e0e7ff; --acc-glow: rgba(79, 70, 229, 0.15); }
body[data-theme="emerald"] { --acc: #059669; --acc-hover: #047857; --acc-light: #ecfdf5; --acc-glow: rgba(5, 150, 105, 0.15); }
body[data-theme="ruby"] { --acc: #be123c; --acc-hover: #9f1239; --acc-light: #fff1f2; --acc-glow: rgba(190, 18, 60, 0.15); }

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:var(--font);background:var(--bg-app);color:var(--ink);font-size:14.5px;line-height:1.45;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;user-select:none}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.hide{display:none!important}

/* ---------- Login Screen ---------- */
#login {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
}
.lg {
  width: 100%; max-width: 400px; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(20px);
  border-radius: 28px; padding: 32px 26px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.2);
}
.lg-header { text-align: center; margin-bottom: 24px; }
.lg-icon {
  width: 56px; height: 56px; background: linear-gradient(135deg, var(--acc) 0%, var(--acc-hover) 100%);
  border-radius: 18px; display: grid; place-items: center; margin: 0 auto 14px; color: #fff; box-shadow: 0 10px 20px var(--acc-glow);
}
.lg h1 { font-size: 22px; font-weight: 700; color: #0f172a; }
.lg p { color: var(--mute); font-size: 13px; margin-top: 4px; }

.fld { display: block; margin-bottom: 14px; }
.fld span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
.in {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px;
  background: #fff7f8; font-size: 14.5px; transition: border-color .2s ease,background-color .2s ease,box-shadow .2s ease;
}
.in:focus { border-color: var(--acc); background: #fff; outline: 0; box-shadow: 0 0 0 4px var(--acc-glow); }


.msg { min-height: 20px; text-align: center; font-size: 13px; color: var(--bad); margin-bottom: 6px; font-weight: 500; }
.hint { margin-top: 12px; font-size: 12px; background: var(--warn-bg); color: var(--warn); padding: 10px 14px; border-radius: 12px; }

.login-story{color:#67465a;background:linear-gradient(145deg,#ffe0e8 0%,#ffefdc 54%,#e5eaff 100%)}
.login-story:after{content:'';position:absolute;inset:0;width:auto;height:auto;right:0;top:0;border:0;border-radius:0;box-shadow:none;pointer-events:none;background-image:radial-gradient(circle at 13% 77%,rgba(255,255,255,.55) 0 5px,transparent 6px),radial-gradient(circle at 88% 23%,rgba(255,255,255,.6) 0 7px,transparent 8px),radial-gradient(circle at 73% 80%,rgba(245,170,196,.2) 0 45px,transparent 46px),radial-gradient(circle at 19% 32%,rgba(255,255,255,.3) 0 60px,transparent 61px)}

.ingredient{background:linear-gradient(145deg,#fff,#fff0f3);border:3px solid rgba(255,255,255,.85);box-shadow:0 12px 28px rgba(179,122,145,.2)}.rice{background:linear-gradient(145deg,#fff,#fff7df)}.fish{background:linear-gradient(145deg,#fff7fb,#ffd5df)}.leaf{background:linear-gradient(145deg,#fff,#e4f1ff)}.art-caption{color:#98778a}
.sushi-friends{position:absolute;right:26px;bottom:62px;z-index:2;display:flex;align-items:flex-end;gap:8px}.sushi-friend{width:53px;height:53px;border:3px solid #fff;border-radius:18px;background:#fff9f7;display:grid;place-items:center;position:relative;box-shadow:0 8px 18px rgba(165,111,135,.18);font-size:29px;transform:rotate(-7deg)}.sushi-friend:nth-child(2){width:46px;height:46px;border-radius:50%;background:#fff7dd;transform:rotate(7deg)}.sushi-friend:nth-child(3){width:39px;height:39px;border-radius:14px;background:#eaf3ff;transform:rotate(-3deg)}.sushi-friend i{position:absolute;bottom:-8px;font-style:normal;font-size:10px;line-height:1;color:#76546a;background:#fff;border-radius:99px;padding:2px 5px;box-shadow:0 2px 5px rgba(100,70,90,.12)}
#login .lg{background:#fffdfb}.lg-icon{background:linear-gradient(140deg,#f4a8bf,#f5c99e);box-shadow:0 8px 18px rgba(224,151,174,.22)}.lg .eyebrow{color:#c26c88}.lg h1{color:#563e4e}.lg .fld span{color:#644d5c}.lg .in{background:#fff9f7;border-color:#f0dfe2}.lg .in:focus{border-color:#e89bb2;box-shadow:0 0 0 4px rgba(232,155,178,.16)}.login-submit{background:linear-gradient(135deg,#ee9db4,#e9a96f);box-shadow:0 7px 17px rgba(226,151,165,.25)}.hint{background:#fff4d9;color:#936a36}.login-note{color:#a18d98!important}
.branch-select-wrap{position:relative}.branch-select-wrap:after{content:'⌄';position:absolute;right:14px;top:50%;transform:translateY(-55%);pointer-events:none;color:var(--mute);font-size:17px}.branch-select{appearance:none;padding-right:38px;font-weight:650}.branch-help{display:block;margin-top:-8px;margin-bottom:13px;color:var(--mute);font-size:11px;line-height:1.45}.branch-admin-card{border:1px solid var(--theme-border-strong);background:linear-gradient(135deg,var(--theme-wash),var(--card-bg));border-radius:16px;padding:15px}.branch-list{display:grid;gap:8px;margin-top:10px}.branch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card-bg)}.branch-row b{min-width:0;overflow-wrap:anywhere}.branch-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}.branch-actions .btn{height:44px;min-height:44px;white-space:nowrap}.branch-actions [data-switch-branch]{min-width:128px}.branch-actions [data-deactivate-branch]{min-width:94px;padding:8px 10px;font-size:11px}.branch-confirm-note{padding:11px 12px;margin:0 0 14px;border:1px solid var(--theme-border-strong);border-radius:13px;background:var(--theme-wash);color:var(--ink);font-size:12px;line-height:1.5}.branch-confirm-note b{color:var(--bad)}.branch-confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.branch-confirm-actions .btn{min-height:43px}

/* ---------- App Shell ---------- */
#app { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg-app); }
.top {
  position: sticky; top: 0; z-index: 30; background: rgba(15, 23, 42, 0.94); backdrop-filter: blur(12px); color: #fff;
  padding: 12px 18px; padding-top: calc(12px + env(safe-area-inset-top, 0px));
  display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08);
}
.brand { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 10px; }
.brand-badge { background: linear-gradient(135deg, var(--acc), var(--acc-hover)); width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; }
.brand small { display: block; color: #94a3b8; font-weight: 400; font-size: 10.5px; }

.dtabs { display: none; gap: 4px; }
.dtabs button { color: #94a3b8; padding: 7px 14px; border-radius: 10px; font-weight: 500; font-size: 13.5px; transition: 0.2s; }
.dtabs button.on { background: rgba(255,255,255,0.15); color: #fff; }

.me { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.08); border-radius: 999px; padding: 3px 5px 3px 12px; border: 1px solid rgba(255,255,255,0.1); }
.me-info { font-size: 11.5px; line-height: 1.2; text-align: right; }
.me-name-row{display:flex;align-items:center;justify-content:flex-end;gap:4px}.me-name-row b{display:block;color:#fff;font-weight:600}.username-edit{width:22px;height:22px;border-radius:8px;background:transparent;color:inherit;display:grid;place-items:center;font-size:14px;line-height:1}.username-edit:hover{background:rgba(255,255,255,.16)}
.me-info span { color: #94a3b8; font-size: 9.5px; }
.me-btn { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.12); color: #fff; display: grid; place-items: center; transition: 0.2s; }

main { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; padding: 16px 14px calc(100px + env(safe-area-inset-bottom, 0px)); }

/* ---------- Bottom Navigation (Mobile Luxury Bar) ---------- */
.nav {
  position: fixed; left: 14px; right: 14px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 22px; display: flex; padding: 5px 6px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}
.nav button {
  flex: 1; color: #94a3b8; font-size: 10px; font-weight: 500; padding: 6px 2px;
  display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: 16px;
  transition: color .24s ease,background-color .24s ease,box-shadow .24s ease; position: relative;
}
.nav button.on { color: #fff; background: rgba(255, 255, 255, 0.12); }
.nav button.on::after {
  content: ''; position: absolute; bottom: 3px; width: 10px; height: 2.5px;
  background: var(--acc); border-radius: 99px; box-shadow: 0 0 6px var(--acc);
}
.nav svg { width: 20px; height: 20px; }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Stats Dash Cards ---------- */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
.st {
  background: var(--card-bg); border-radius: var(--r); padding: 14px; border: 1px solid var(--line);
  box-shadow: var(--shadow-sm); position: relative;
}
.st small { color: var(--mute); font-size: 11.5px; font-weight: 500; display: block; }
.st b { display: block; font-size: 20px; font-weight: 700; color: var(--ink); margin: 3px 0 1px; }
.st.alert { background: #fffbf0; border-color: #fde68a; } .st.alert b { color: var(--warn); }
.st.bad { background: #fff1f2; border-color: #fecdd3; } .st.bad b { color: var(--bad); }
.st[data-stock-filter]{cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}.st[data-stock-filter]:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--acc)}.st[data-stock-filter]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.st[data-stock-filter],.st[data-dashboard-stock-filter]{padding-right:42px;border-color:var(--theme-border-strong)}.st[data-stock-filter]::after,.st[data-dashboard-stock-filter]::after{content:'›';position:absolute;top:10px;right:10px;width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--theme-border-strong);border-radius:50%;background:var(--acc-light);color:var(--acc-hover);font-size:20px;font-weight:700;line-height:1}

/* ---------- Toolbar & Controls ---------- */
.tools { display: grid; gap: 10px; margin-bottom: 14px; }
.srch { position: relative; }
.srch svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--mute); }
.srch .in { padding-left: 40px; background: var(--card-bg); border-radius: 12px; }
.flt { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.flt::-webkit-scrollbar { display: none; }
.flt select {
  flex: 1; min-width: 115px; padding: 9px 12px; border: 1.5px solid var(--line);
  border-radius: 12px; background: var(--card-bg); font-size: 13px; color: #334155; font-weight: 500;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 13.5px; min-height: 42px;
  background: linear-gradient(135deg, var(--acc) 0%, var(--acc-hover) 100%); color: #fff;
  box-shadow: 0 4px 12px var(--acc-glow); transition: transform .18s ease,background-color .24s ease,border-color .24s ease,color .24s ease,box-shadow .24s ease;
}
.btn:active { transform: scale(0.98); }
.btn.sec { background: var(--card-bg); color: #334155; border: 1.5px solid var(--line); box-shadow: none; }
.btn.bad { background: var(--bad); color: #fff; box-shadow: 0 4px 12px rgba(225, 29, 72, 0.2); }
.btn.sm { min-height: 32px; padding: 5px 10px; font-size: 12px; border-radius: 8px; }

/* ---------- Clean Product Items (คลิกเพื่อเบิกจ่ายด้านใน ไม่เกะกะ) ---------- */
.list { display: grid; gap: 8px; }
.list.is-reordering { user-select: none; -webkit-user-select: none; }
.row-placeholder { min-height: 82px; border: 2px dashed var(--acc); border-radius: var(--r); background: var(--acc-light); opacity: .78; }
.head { display: none; }
.row {
  background: var(--card-bg); border-radius: var(--r); padding: 12px 14px;
  display: grid; grid-template-columns: 1fr auto; gap: 6px 10px;
  border: 1px solid var(--line); box-shadow: var(--shadow-sm); position: relative;
  transition: transform .2s ease,border-color .2s ease,box-shadow .2s ease,background-color .2s ease; cursor: pointer;
}
.row:hover { border-color: var(--acc); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.row::before {
  content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3.5px;
  border-radius: 0 4px 4px 0; background: var(--ok);
}
.row.low::before { background: var(--warn); }
.row.out::before { background: var(--bad); }
.c-name { padding-left: 0; }
.drag-handle {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  width: 28px; height: 38px; display: grid; place-items: center;
  color: var(--mute); border-radius: 9px; cursor: grab; touch-action: none; overscroll-behavior: contain;
  user-select: none; -webkit-user-select: none; transition: color .18s, background .18s, opacity .18s;
}
.drag-handle svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.drag-handle:not(:disabled):hover { color: var(--acc
